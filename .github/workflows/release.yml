name: Release Addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例: v0.0.1, v0.1.0-beta.1). 空欄時は __init__.py より自動検出'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            maturin_args: ""
            manylinux: "off"
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            maturin_args: "--compatibility manylinux2014"
            manylinux: "auto"
          - os: macos-latest
            platform: macos-universal
            target: universal2-apple-darwin
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            maturin_args: ""
            manylinux: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Build wheel using maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.maturin_args }}
          manylinux: ${{ matrix.manylinux }}

      - name: Build standalone GUI (cloth_gui)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-universal" ]; then
            cargo build --release -p cloth_gui --target x86_64-apple-darwin
            cargo build --release -p cloth_gui --target aarch64-apple-darwin
            mkdir -p target/release
            lipo -create \
              target/x86_64-apple-darwin/release/taremin_cloth_gui \
              target/aarch64-apple-darwin/release/taremin_cloth_gui \
              -output target/release/taremin_cloth_gui
            echo "GUI_BIN=target/release/taremin_cloth_gui" >> $GITHUB_ENV
          else
            cargo build --release -p cloth_gui --target ${{ matrix.target }}
            GUI_BIN="target/${{ matrix.target }}/release/taremin_cloth_gui"
            if [ "${{ matrix.platform }}" = "windows-x64" ]; then
              GUI_BIN="${GUI_BIN}.exe"
            fi
            echo "GUI_BIN=$GUI_BIN" >> $GITHUB_ENV
          fi

      - name: Package Blender Addon
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(python -c "from tools.package_addon import extract_bl_info_version; from pathlib import Path; print(extract_bl_info_version(Path('__init__.py')))")"
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v${VERSION}"
          fi
          OUTPUT_ZIP="dist/taremin_cloth-${VERSION}-${{ matrix.platform }}.zip"
          python tools/package_addon.py --wheel dist --gui-binary "$GUI_BIN" --require-gui --output "$OUTPUT_ZIP" --version "${VERSION#v}"
          echo "ZIP_FILE=$OUTPUT_ZIP" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.platform }}
          path: ${{ env.ZIP_FILE }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(python -c "from tools.package_addon import extract_bl_info_version; from pathlib import Path; print(extract_bl_info_version(Path('__init__.py')))")"
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v${VERSION}"
          fi
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

          LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if [[ "$LOWER" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        shell: bash
        run: |
          python tools/generate_changelog.py --tag "${{ steps.tag.outputs.tag_name }}" --output changelog.md
          cat changelog.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          body_path: changelog.md
          files: release_assets/*.zip
          draft: false
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
