name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan and Mesa drivers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri

      - name: Run Cargo Tests
        shell: bash
        run: cargo test

  test-python:
    name: Python Unit Tests & Lint
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Build PyO3 Core Extension
        shell: bash
        run: |
          cargo build --release -p taremin_cloth_core
          cp target/release/taremin_cloth_core.dll taremin_cloth_core.pyd
          mkdir -p python/taremin_cloth
          cp target/release/taremin_cloth_core.dll python/taremin_cloth/taremin_cloth_core.pyd

      - name: Run Python Unit Tests
        shell: bash
        run: |
          python -m unittest discover -s tests/core -t .

      - name: Check Documentation Integrity (Links, Mermaid, KaTeX)
        shell: bash
        run: |
          python tools/check_markdown_links.py README.md AGENTS.md docs/*.md
